services:
  loxone-config:
    image: "local/loxone-config:latest"
    container_name: loxone-config
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5800:5800"
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      - HOME=/config/
      - WINEPREFIX=/config/wine
      - WINEARCH=win64
      - XLANG=de
      # - REINSTALL=1  # set to 1 to reinstall Loxone Config on next start
    volumes:
      - "./config:/config:rw"
      - "./config/Loxone:/config/wine/drive_c/users/app/Documents/Loxone:rw"
      - "./Projects/@Biller.Loxone:/config/wine/drive_c/users/app/Documents/Loxone/Loxone Config/Projects/@Biller.Loxone:ro"
      - "./Projects/Projects.json:/config/wine/drive_c/users/app/Documents/Loxone/Projects.json:ro"
